                          type: string
                        updated_at:
                          description: 更新时间
                          format: date-time
                          type: string
                        user_id:
                          description: 用户ID
                          type: string
                        user_name:
                          description: 用户名
                          type: string
                      type: object
                    type: array
                  has_more:
                    description: 是否有更多数据
                    type: boolean
                  page:
                    description: 当前页码
                    type: integer
                  page_size:
                    description: 每页数量
                    type: integer
                  total:
                    description: 总记录数
                    type: integer
                type: object
        "400":
