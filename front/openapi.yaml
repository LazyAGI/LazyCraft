                      type: integer
                    cutoff_len:
                      description: 序列最大长度
                      type: string
                    learning_rate:
                      description: 学习率
                      type: number
                    lora_r:
                      description: LoRa秩
                      type: integer
                    lora_rate:
                      description: 微调占比
                      type: integer
                    lr_scheduler_type:
                      description: 学习率调整策略
                      type: string
                    num_epochs:
                      description: 重复次数
                      type: integer
                    num_gpus:
                      description: GPU数量
