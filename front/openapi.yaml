        "200":
          description: 成功
        "401":
          description: 未授权
      security:
        - Bearer: []
      summary: |-
        用户退出登录。

        注销当前用户会话，删除访问令牌并记录退出日志。

        Returns:
            dict: 退出成功的结果字典
      tags:
        - auth
  /logs:
    get:
      description: 查询用户的操作日志，支持按日期、用户、模块、动作等条件筛选。所有时间参数均为北京时间（Asia/Shanghai），系统会自动转换为 UTC
        进行查询。只有管理员才有权查看其他用户的操作日志，普通用户只能查看自己的日志，需要登录
      parameters:
        - description: 开始日期，格式为 YYYY-MM-DD，默认为今天。所有时间参数均为北京时间（Asia/Shanghai）
          in: query
          name: start_date
          required: false
          schema:
            type: string
            format: date
        - description: 结束日期，格式为 YYYY-MM-DD，默认为今天。所有时间参数均为北京时间（Asia/Shanghai）
          in: query
          name: end_date
          required: false
          schema:
            type: string
            format: date
        - description: 操作的详细信息，支持模糊匹配
          in: query
          name: details
          required: false
          schema:
            type: string
        - description: 分页页码，从 1 开始
          in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - description: 每页记录数
          in: query
          name: per_page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - description: 组织的唯一标识符。如果有组织ID，查询该组织下所有用户的操作日志（当前日志中并未记录日志所属的工作空间信息，故该参数无效）
          in: query
          name: organization_id
          required: false
          schema:
            type: string
            default: ""
        - description: 用户账户ID。只有管理员才有权查看其他用户的操作日志，普通用户只能查看自己的日志
          in: query
          name: account_id
          required: false
          schema:
            type: string
            default: ""
        - description: 用户名称，支持模糊匹配
          in: query
          name: user_name
          required: false
          schema:
            type: string
        - description: 操作模块名称，支持模糊匹配
          in: query
          name: module
          required: false
          schema:
            type: string
        - description: 操作动作名称，支持模糊匹配
          in: query
          name: action
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 获取成功
          content:
            "*/*":
              schema:
                properties:
                  code:
                    example: 200
                    type: integer
                  data:
                    properties:
                      data:
                        description: 日志列表
                        items:
                          properties:
                            action:
                              description: 操作动作名称
                              type: string
                            created_at:
                              description: 创建时间
                              format: date-time
                              type: string
                            details:
                              description: 操作详细信息
                              type: string
                            id:
                              description: 日志ID
                              type: integer
                            module:
                              description: 操作模块名称
                              type: string
                            username:
                              description: 用户名
                              type: string
                          type: object
                        type: array
                      page:
                        description: 当前页码
                        type: integer
                      per_page:
                        description: 每页数量
                        type: integer
                      total:
                        description: 总记录数
                        type: integer
                    type: object
                type: object
        "400":
          description: 参数错误
        "401":
          description: 未授权
        "403":
          description: 无权限
      security:
        - Bearer: []
      summary: >-
        查询用户的操作日志。


        所有时间参数均为北京时间（Asia/Shanghai），系统会自动转换为 UTC 进行查询。

        只有管理员才有权查看其他用户的操作日志，普通用户只能查看自己的日志。


        Args:
            organization_id (int, optional): 组织的唯一标识符。如果有组织ID，查询该组织下所有用户的操作日志。
            start_date (str, optional): 开始日期，格式为 'YYYY-MM-DD'。如果有开始日期，过滤该日期之后的操作日志。
            end_date (str, optional): 结束日期，格式为 'YYYY-MM-DD'。如果有结束日期，过滤该日期之前的操作日志。
            details (str, optional): 操作的详细信息。如果有详细信息，模糊匹配该信息的操作日志。
            page (int, optional): 分页页码，默认为1。
            per_page (int, optional): 每页记录数，默认为10。
            account_id (str, optional): 用户账户ID。
            user_name (str, optional): 用户名称。
            module (str, optional): 操作模块名称。
            action (str, optional): 操作动作名称。

        Returns:
            dict: 包含操作日志数据的响应字典，包含data、total、page、per_page字段。

        Raises:
            ValueError: 当日期格式不正确时抛出。
            PermissionError: 当用户没有权限查看其他用户日志时抛出。
      tags:
        - 操作日志
