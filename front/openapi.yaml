                request_id:
                  description: 申请ID
                  type: string
              required:
                - request_id
                - action
              type: object
        description: 处理参数
        required: true
      responses:
        "200":
          description: 处理成功
          content:
            "*/*":
              schema:
                properties:
                  code:
                    example: 200
                    type: integer
                  message:
                    example: success
                    type: string
                type: object
        "400":
          description: 参数错误
        "401":
          description: 未授权
        "403":
          description: 无权限
      security:
        - Bearer: []
      summary: 处理配额申请
      tags:
        - 工作空间
  /workspaces/quota-requests/requests:
    post:
      description: 提交配额申请（存储或GPU），需要登录和管理员权限
      requestBody:
        content:
          application/json:
            schema:
              properties:
                amount:
                  description: 申请数量
                  type: integer
                reason:
                  description: 申请原因
                  type: string
                tenant_id:
                  description: 租户ID
                  type: string
                type:
                  description: 申请类型：storage 或 gpu
                  enum:
                    - storage
                    - gpu
                  type: string
              required:
                - type
                - amount
                - reason
                - tenant_id
              type: object
        description: 申请数据
        required: true
      responses:
        "200":
          description: 提交成功
          content:
            "*/*":
              schema:
                properties:
                  code:
                    example: 200
                    type: integer
                  message:
                    example: success
                    type: string
                type: object
        "400":
          description: 参数错误
        "401":
          description: 未授权
        "403":
          description: 无权限
      security:
        - Bearer: []
      summary: 提交配额申请
      tags:
        - 工作空间
  /workspaces/select/members:
    get:
      description: 查看所有的用户（仅在选择用户列表中使用），支持分页和搜索，需要登录
      parameters:
        - description: 页码，从 1 开始
          in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
        - description: 每页数量
          in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 20
        - description: 名称搜索
          in: query
          name: search_name
          required: false
          schema:
            type: string
        - description: 电话搜索
          in: query
          name: search_phone
          required: false
          schema:
            type: string
        - description: 邮箱搜索
          in: query
          name: search_email
          required: false
          schema:
            type: string
        - description: 租户ID
          in: query
          name: tenant_id
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 获取成功
          content:
            "*/*":
              schema:
                properties:
                  data:
                    description: 账户列表
                    items:
                      properties:
                        avatar:
                          description: 头像
                          type: string
                        created_at:
                          description: 创建时间
                          type: integer
                        email:
                          description: 邮箱
                          type: string
                        id:
                          description: 账户ID
                          type: string
                        last_active_at:
                          description: 最后活跃时间
                          type: integer
                        last_login_at:
                          description: 最后登录时间
                          type: integer
                        name:
                          description: 账户名称
                          type: string
                        phone:
                          description: 电话
                          type: string
                        role:
                          description: 角色
                          type: string
                        status:
                          description: 状态
                          type: string
                      type: object
                    type: array
                  has_more:
                    description: 是否有更多数据
                    type: boolean
                  limit:
                    description: 每页数量
                    type: integer
                  page:
                    description: 当前页码
                    type: integer
                  total:
                    description: 总记录数
                    type: integer
                type: object
        "400":
          description: 参数错误
        "401":
          description: 未授权
        "403":
          description: 无权限
      security:
        - Bearer: []
      summary: |-
        查看所有的用户(仅在选择用户列表中使用)。

        Returns:
            dict: 包含分页用户列表的响应数据
      tags:
        - 工作空间
  /workspaces/storage/check:
    get:
      description: 查看当前工作组的存储空间使用情况，需要登录
      responses:
        "200":
          description: 获取成功
          content:
            "*/*":
              schema:
                properties:
                  data:
                    description: 是否有可用空间
                    type: boolean
                type: object
        "400":
          description: 参数错误
        "401":
          description: 未授权
        "403":
          description: 无权限
      security:
        - Bearer: []
      summary: 查看当前工作组的存储空间使用情况
      tags:
        - 工作空间
  /workspaces/switch:
    post:
      description: 切换当前用户的租户，需要登录
      requestBody:
        content:
          application/json:
            schema:
              properties:
                tenant_id:
                  description: 租户ID
                  type: string
              required:
                - tenant_id
              type: object
        description: 切换参数
        required: true
      responses:
        "200":
          description: 切换成功
          content:
            "*/*":
              schema:
                properties:
                  result:
                    example: success
                    type: string
                type: object
        "400":
          description: 参数错误
        "401":
          description: 未授权
        "403":
          description: 无权限
      security:
        - Bearer: []
      summary: |-
        切换租户。

        Returns:
            dict: 切换成功的响应消息
      tags:
        - 工作空间
  /workspaces/tenant/enable_ai:
    post:
      description: 设置是否开启租户的AI能力，需要登录和超级管理员权限
      requestBody:
        content:
          application/json:
            schema:
              properties:
                enable:
                  description: 是否启用AI
                  type: boolean
                tenant_id:
                  description: 租户ID
                  type: string
              required:
                - enable
                - tenant_id
              type: object
        description: 启用参数
        required: true
      responses:
        "200":
          description: 设置成功
          content:
            "*/*":
              schema:
                properties:
                  code:
                    example: 200
                    type: integer
                  message:
                    example: success
                    type: string
                type: object
        "400":
          description: 参数错误
        "401":
          description: 未授权
        "403":
          description: 无权限
      security:
        - Bearer: []
      summary: |-
        设置是否开启租户的AI能力。

        Args:
            无直接参数。请求体中应包含以下JSON字段：
                enable (bool): 是否开启，必填。
                tenant_id (str): 租户ID，必填。

        Returns:
            - 若成功，返回({"message": "success", "code": 200, "data": 数据}, 200)
      tags:
        - 工作空间
  /workspaces/tenant/user_list:
    get:
      description: 查询当前租户下全部用户列表，需要登录
      responses:
        "200":
          description: 获取成功
          content:
            "*/*":
              schema:
                description: 用户列表
                items:
                  type: object
                type: array
        "400":
          description: 参数错误
        "401":
          description: 未授权
        "403":
          description: 无权限
      security:
        - Bearer: []
      summary: 查询当前租户下全部用户列表
      tags:
        - 工作空间
  /workspaces/update-roles:
    post:
      description: 修改租户内的用户身份和配额，需要登录和管理员权限
      requestBody:
        content:
          application/json:
            schema:
              properties:
                data_list:
                  description: 用户角色列表
                  items:
                    properties:
                      account_id:
                        type: string
                      name:
                        type: string
                      role:
                        type: string
                    type: object
                  type: array
                gpu_quota:
                  description: GPU配额
                  type: integer
                storage_quota:
                  default: 0
                  description: 存储配额（GB）
                  type: integer
                tenant_id:
                  description: 租户ID
                  type: string
                tenant_name:
                  description: 租户名称
                  type: string
              required:
                - tenant_id
                - storage_quota
              type: object
        description: 角色数据
        required: true
      responses:
        "200":
          description: 更新成功
          content:
            "*/*":
              schema:
                properties:
                  result:
                    example: success
                    type: string
                type: object
        "400":
          description: 参数错误
        "401":
          description: 未授权
        "403":
          description: 无权限
      security:
        - Bearer: []
      summary: |-
        修改租户内的用户身份
        "data_list": [
            {
                "account_id": "87079ad4-5bce-4f28-972c-644084d939e7",
                "name": "名字",
                "role": "owner"
            },
        ]
      tags:
        - 工作空间
security:
  - Bearer: []
tags:
  - description: 应用商店相关的 API
    name: 应用商店
  - description: 资源库-数据库管理相关的 API（数据库、表、数据管理等）
    name: 数据库管理
  - description: 资源库-知识库管理相关的 API（知识库、文件管理等）
    name: 知识库管理
  - description: 资源库-知识库-文档管理相关的 API（文档CRUD、发布、图片上传等）
    name: 文档管理
  - description: Prompt相关的 API
    name: Prompt
  - description: 模型仓库-模型管理相关的 API（模型管理、创建、更新、删除、上传、微调模型管理等）
    name: 模型仓库
  - description: 模型仓库-模型评测相关的 API（评估任务管理、数据集上传、评估执行、报告下载等）
    name: 模型评测
  - description: 推理服务相关的 API
    name: 推理服务
  - description: 模型微调相关的 API
    name: 模型微调
  - description: 工具相关的 API
    name: 工具
  - description: 工具-MCP工具相关的 API（MCP服务器管理、工具管理等）
    name: MCP工具
  - description: 数据集相关的 API（数据集管理、脚本管理、数据回流等）
    name: 数据集
  - description: 标签相关的 API
    name: 标签管理
  - description: API Key 管理相关的 API
    name: API Key
  - description: 认证相关的 API（登录、注册、OAuth等）
    name: auth
  - description: 对话相关的 API（会话管理、对话交互等）
    name: conversation
  - description: 成本审计相关的 API（token统计、应用统计等）
    name: cost_audit
  - description: 操作日志相关的 API（日志查询等）
    name: 操作日志
  - description: 系统消息相关的 API（通知创建、查询、已读标记等）
    name: 系统消息
  - description: 文件管理相关的 API（文件上传等）
    name: 文件管理
  - description: 工作空间相关的 API（租户管理、用户管理、协作、配额管理等）
    name: 工作空间
servers:
  - url: http://localhost:30382/console/api
  - url: https://localhost:30382/console/api
components:
  requestBodies:
    Body:
      content:
        application/json:
          schema:
            properties:
              app_id:
                description: 应用ID
                format: uuid
                type: string
            required:
              - app_id
            type: object
      required: true
    Body2:
      content:
        application/json:
          schema:
            properties:
              name:
                description: 标签名称
                type: string
              type:
                description: 标签类型
                enum:
                  - knowledgebase
                  - app
                  - model
                  - tool
                  - prompt
                  - dataset
                  - script
                  - mcp
                type: string
            required:
              - name
              - type
            type: object
      required: true
    Body3:
      content:
        application/json:
          schema:
            properties:
              files:
                description: 文件列表
                items:
                  type: string
                type: array
              inputs:
                description: 输入内容列表
                items:
                  type: string
                type: array
            required:
              - inputs
            type: object
      required: true
    Body4:
      content:
        application/json:
          schema:
            properties:
              id:
                description: 工具ID
                type: string
            required:
              - id
            type: object
      description: 工具ID
      required: true
    Body5:
      content:
        application/json:
          schema:
            properties:
              email:
                description: 邮箱（可选）
                format: email
                type: string
              name:
                description: 用户名（可选）
                type: string
              phone:
                description: 手机号（可选）
                type: string
            type: object
      required: true
    Body6:
      content:
        application/json:
          schema:
            properties:
              tool_id:
                description: 工具ID
                type: string
            required:
              - tool_id
            type: object
      description: 授权参数
      required: true
    Body7:
      content:
        application/json:
          schema:
            properties:
              categories:
                description: 应用分类
                items:
                  type: string
                type: array
              description:
                description: 应用描述
                type: string
              icon:
                description: 应用图标
                type: string
              icon_background:
                description: 图标背景色
                type: string
              name:
                description: 应用名称
                type: string
            required:
              - name
            type: object
      required: true
    Body8:
      content:
        application/json:
          schema:
            properties:
              name:
                description: 产商名称
                type: string
              type:
                description: 产商类型
                enum:
                  - llm
                  - embedding
                  - reranker
                type: string
            required:
              - name
              - type
            type: object
      required: true
    Body9:
      content:
        application/json:
          schema:
            properties:
              data_set_version_ids:
                description: 数据集版本ID列表
                items:
                  type: string
                type: array
            required:
              - data_set_version_ids
            type: object
      required: true
    Body10:
      content:
        application/json:
          schema:
            properties:
              data_set_version_id:
                description: 数据集版本ID
                type: string
            required:
              - data_set_version_id
            type: object
      required: true
    Body11:
      content:
        application/json:
          schema:
            properties:
              data_set_script_id:
                description: 数据集脚本ID
                type: string
              data_set_version_id:
                description: 数据集版本ID
                type: string
              data_set_version_name:
                description: 数据集版本名称
                type: string
              script_agent:
                default: script
                description: 脚本代理类型
                enum:
                  - script
                type: string
              script_type:
                description: 脚本类型
                enum:
                  - 数据过滤
                  - 数据增强
                  - 数据去噪
                  - 数据标注
                  - 智能处理
                type: string
            required:
              - data_set_version_id
              - data_set_script_id
            type: object
      required: true
    Body12:
      content:
        application/json:
          schema:
            properties:
              group_id:
                description: 服务组ID
                type: integer
            required:
              - group_id
            type: object
      description: 服务组ID
      required: true
    Body13:
      content:
        application/json:
          schema:
            properties:
              service_id:
                description: 服务ID
                type: integer
            required:
              - service_id
            type: object
      description: 服务ID
      required: true
    Body14:
      content:
        application/json:
          schema:
            properties:
              encrypted_data:
                description: 加密后的登录数据（Base64编码）
                type: string
              session_id:
                description: 会话ID（从密钥交换接口获取）
                format: uuid
                type: string
            required:
              - encrypted_data
              - session_id
            type: object
      required: true
    Body15:
      content:
        application/json:
          schema:
            properties:
              id:
                description: MCP服务器ID
                type: integer
            required:
              - id
            type: object
      description: MCP服务器ID
      required: true
  securitySchemes:
    Bearer:
      description: "JWT Token 认证，格式: Bearer <token>"
      in: header
      name: Authorization
      type: apiKey
