                          type: object
                        http_url:
                          description: HTTP URL
                          type: string
                        icon:
                          description: 服务器图标
                          type: string
                        id:
                          description: 服务器ID
                          type: integer
                        name:
                          description: 服务器名称
                          type: string
                        publish:
