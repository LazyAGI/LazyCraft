                          type: string
                        ref_status:
                          description: 引用状态
                          type: boolean
                        stdio_arguments:
                          description: STDIO参数
                          type: string
                        stdio_command:
                          description: STDIO命令
                          type: string
                        stdio_env:
                          description: STDIO环境变量
                          type: object
                        sync_tools_at:
                          description: 同步工具时间
                          format: date-time
                          type: string
                        tags:
                          description: 标签列表
