        "400":
          description: 参数错误
        "401":
          description: 未授权
        "403":
          description: 无权限
      security:
        - Bearer: []
      summary: |-
        获取模型树结构。

        Args:
            qtype (str, optional): 查询类型。默认为"already"。
            model_type (str, optional): 模型类型筛选条件。默认为空字符串。
            model_kind (str, optional): 模型种类筛选条件。默认为空字符串。
            
