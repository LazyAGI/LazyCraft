openapi: 3.0.0
info:
  contact:
    name: LazyLLM Team
  description: LazyCraft 平台 API 文档
  title: LazyCraft API
  version: 1.0.0
paths:
  /account/add_user:
    post:
      description: 管理员创建新用户账号，不需要短信验证码
      requestBody:
        content:
          application/json:
            schema:
              properties:
                confirm_password:
                  description: 确认密码
                  type: string
                email:
                  description: 邮箱（可选）
                  format: email
                  type: string
                name:
                  description: 用户名
                  type: string
                password:
                  description: 密码
                  type: string
                phone:
                  description: 手机号（可选）
                  type: string
              required:
                - name
                - password
                - confirm_password
              type: object
        required: true
      responses:
        "200":
          description: 成功
        "400":
          description: 参数错误
        "401":
          description: 未授权
        "403":
          description: 无权限
      security:
        - Bearer: []
      summary: |-
        管理员添加用户。

        允许管理员创建新用户账号，不需要短信验证码。
        只有具有管理员权限的用户才能调用此接口。

        Returns:
            dict: 包含创建成功结果和用户ID的字典

        Raises:
            ValueError: 当非管理员调用或输入信息无效时抛出
      tags:
        - auth
  /account/password:
    post:
      description: 修改当前用户的登录密码
      requestBody:
        content:
          application/json:
            schema:
              properties:
                new_password:
                  description: 新密码
                  type: string
                password:
                  description: 当前密码（可选）
                  type: string
                repeat_new_password:
                  description: 确认新密码
                  type: string
              required:
                - new_password
                - repeat_new_password
              type: object
        required: true
      responses:
        "200":
          description: 成功
        "400":
          description: 参数错误
        "401":
          description: 未授权
        "403":
          description: 无权限
      security:
        - Bearer: []
      summary: |-
        修改用户密码。

        允许用户修改自己的登录密码，需要提供当前密码进行验证。
        修改成功后记录密码变更日志。

        Returns:
            dict: 密码修改成功的结果字典

        Raises:
            ValueError: 当新密码确认不一致或当前密码验证失败时抛出
      tags:
        - auth
  /account/profile:
    get:
      description: 获取当前登录用户的详细信息和租户信息
      responses:
        "200":
          description: 成功
        "401":
          description: 未授权
        "403":
          description: 无权限
      security:
        - Bearer: []
      summary: |-
        获取当前用户资料信息。

        返回当前登录用户的详细信息以及当前租户信息和权限角色。
        包括用户基本信息、租户状态、用户在租户中的角色等。

        Returns:
            dict: 包含用户信息和租户信息的字典
      tags:
        - auth
  /account/update:
    post:
      description: 更新当前用户的基本信息（姓名、邮箱、手机号）
      requestBody:
        $ref: "#/components/requestBodies/Body5"
      responses:
        "200":
          description: 成功
        "400":
          description: 参数错误
        "401":
          description: 未授权
        "403":
          description: 无权限
      security:
        - Bearer: []
      summary: |-
        更新用户基本信息。

        允许用户修改姓名、邮箱、手机号等基本信息。
        会验证信息格式和唯一性约束，修改成功后记录更新日志。

        Returns:
            dict: 用户信息更新成功的结果字典

        Raises:
            ValueError: 当输入格式无效或违反唯一性约束时抛出
      tags:
        - auth
  /account/validate_exist:
    post:
      description: 验证用户名、手机号或邮箱是否已被使用
      requestBody:
        $ref: "#/components/requestBodies/Body5"
      responses:
        "200":
          description: 成功
        "400":
          description: 参数错误
        "401":
          description: 未授权
      security: []
      summary: |-
        校验用户信息唯一性。

        验证用户名、手机号或邮箱是否已被其他用户使用。
        用于注册前的重复性检查。

        Returns:
            dict: 包含验证结果的字典，success表示可用，failed表示已存在

        Note:
            即使验证失败也不会抛出异常，而是返回包含错误信息的字典
      tags:
        - auth
  /apikey:
    delete:
      description: 删除指定的 API Key
      requestBody:
        content:
          application/json:
            schema:
              properties:
                id:
                  description: API Key ID
                  type: integer
              required:
                - id
              type: object
        required: true
      responses:
        "200":
          description: 成功
        "204":
          description: 成功删除
        "400":
          description: 参数错误
        "401":
          description: 未授权
        "403":
          description: 无权限
      security:
        - Bearer: []
      summary: |-
        删除指定的API Key。

        Args:
            id (int, required): 要删除的API Key的ID

        Returns:
            dict: 删除操作的结果

        Raises:
            CommonError: 当API Key不存在或不属于当前用户时抛出
      tags:
        - API Key
    get:
      description: 获取当前用户的所有 API Key 列表
      responses:
        "200":
          description: 成功
        "401":
          description: 未授权
        "403":
          description: 无权限
      security:
        - Bearer: []
      summary: |-
        获取当前用户的所有API Key列表。

        Returns:
            dict: 包含API Key详细信息的字典，使用apikey_detail_fields格式化

        Raises:
            CommonError: 当查询失败时抛出
      tags:
        - API Key
    post:
      description: 创建新的 API Key
      requestBody:
        content:
          application/json:
            schema:
              properties:
                description:
                  description: API Key 描述
                  type: string
                expire_date:
                  description: 过期日期，格式：YYYY-MM-DD
                  format: date
                  type: string
                tenant_id:
                  description: 空间ID，多个空间ID用逗号分隔
                  type: string
              required:
                - tenant_id
              type: object
        required: true
      responses:
        "200":
          description: 成功
        "400":
          description: 参数错误
        "401":
          description: 未授权
        "403":
          description: 无权限
      security:
        - Bearer: []
      summary: |-
        创建新的API Key。

        Args:
            description (str, optional): API Key的描述信息
            expire_date (str, optional): 过期时间，格式为YYYY-MM-DD
            tenant_id (str, required): 空间ID，多个空间ID用逗号分隔

        Returns:
            dict: 新创建的API Key详细信息

        Raises:
            CommonError: 当参数验证失败或创建失败时抛出
      tags:
        - API Key
    put:
      description: 更新 API Key 的状态（active, disabled, deleted, expired）
      requestBody:
        content:
          application/json:
            schema:
              properties:
                id:
                  description: API Key ID
                  type: integer
                status:
                  description: 状态：active, disabled, deleted, expired
                  enum:
                    - active
                    - disabled
                    - deleted
                    - expired
                  type: string
              required:
                - id
                - status
              type: object
        required: true
      responses:
        "200":
          description: 成功
        "400":
          description: 参数错误
        "401":
          description: 未授权
        "403":
          description: 无权限
      security:
        - Bearer: []
      summary: |-
        更新API Key的状态。

        Args:
            id (int, required): 要更新的API Key的ID
            status (str, required): 新的状态，可选值：active, disabled, deleted, expired

        Returns:
            dict: 更新后的API Key详细信息

        Raises:
            CommonError: 当API Key不存在、不属于当前用户或状态转换不允许时抛出
      tags:
        - API Key
  "/apikey/chat/{app_id}":
    post:
      description: 使用 API Key 与指定应用进行对话
      parameters:
        - description: 应用ID
          in: path
          name: app_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                files:
                  description: 文件列表，可为空
                  items:
                    type: string
                  type: array
                inputs:
                  description: 输入内容列表
                  items:
                    type: string
                  minItems: 1
                  type: array
                mode:
                  default: publish
                  description: 运行模式，默认为 publish
                  type: string
              required:
                - inputs
              type: object
        required: true
      responses:
        "200":
          description: 成功
        "400":
          description: 参数错误
        "401":
          description: 未授权
        "403":
          description: 无权限
      security:
        - Bearer: []
      summary: |-
        使用API Key与指定应用进行对话。

        Args:
            app_id (str): 应用ID
            inputs (list, required): 输入内容列表
            mode (str, optional): 运行模式，默认为"publish"
            files (list, optional): 文件列表，可为空

        Returns:
            dict: 对话结果数据

        Raises:
            CommonError: 当API Key验证失败、应用不存在或服务未开启时抛出
      tags:
        - API Key
  /app/report:
    post:
      description: 获取应用的使用报告
      requestBody:
        content:
          application/json:
            schema:
              properties:
                app_id:
                  description: 应用ID
                  format: uuid
                  type: string
                end_date:
                  description: 结束日期
                  format: date
                  type: string
                start_date:
                  description: 开始日期
                  format: date
                  type: string
              required:
                - app_id
              type: object
        required: true
      responses:
        "200":
          description: 成功
        "400":
          description: 参数错误
        "401":
          description: 未授权
        "403":
          description: 无权限
      security:
        - Bearer: []
      summary: |-
        接收引擎报告回调数据。

        Args:
            id (str, required): 节点ID
            sessionid (str, required): 会话ID
            timecost (float, optional): 耗时
            prompt_tokens (int, optional): 提示词token数
            completion_tokens (int, optional): 完成token数
            input (str, optional): 输入内容
            output (str, optional): 输出内容

        Returns:
            None: 无返回值

        Raises:
            Exception: 当数据处理失败时抛出
      tags:
        - 应用商店
  /apps:
    get:
      description: 根据查询参数获取应用的分页列表，支持按名称、标签、发布状态等条件筛选
      parameters:
        - description: 页码，从 1 开始
          in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 99999
            default: 1
        - description: 每页数量
          in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - description: 搜索应用名称
          in: query
          name: search_name
          required: false
          schema:
            type: string
        - description: 搜索标签名称
          in: query
          name: search_tags
          required: false
          schema:
            type: string
        - description: 查询类型：mine/group/builtin/already
          in: query
          name: qtype
          required: false
          schema:
            type: string
            enum:
              - mine
              - group
              - builtin
              - already
            default: mine
        - description: 是否已发布
          in: query
          name: is_published
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: 成功
        "401":
          description: 未授权
        "403":
          description: 无权限
      security:
        - Bearer: []
      summary: >-
        获取应用列表。


        根据查询参数获取应用的分页列表，支持按名称、标签、发布状态等条件筛选。


        Args:
            page (int, optional): 页码，范围1-99999，默认为1。
            limit (int, optional): 每页数量，范围1-100，默认为20。
            search_name (str, optional): 搜索应用名称，支持模糊匹配。
            search_tags (str, optional): 搜索标签名称。
            qtype (str, optional): 查询类型，可选值：mine（我的）/group（团队）/builtin（内置）/already（全部），默认为mine。
            is_published (bool, optional): 是否已发布的过滤条件。

        Returns:
            dict: 包含应用列表的分页数据，包含data、total、page、limit字段。

        Raises:
            ValueError: 当参数验证失败时抛出。
      tags:
        - 应用商店
    post:
      description: 创建空白的应用
      requestBody:
        $ref: "#/components/requestBodies/Body7"
      responses:
        "200":
          description: 成功
        "201":
          description: 成功创建应用
          content:
            "*/*":
              schema:
                properties:
                  categories:
                    description: 应用分类
                    items:
                      type: string
                    type: array
                  created_at:
                    description: 创建时间
                    format: date-time
                    type: string
                  created_by:
                    description: 创建者ID
                    type: string
                  description:
                    description: 应用描述
                    type: string
                  enable_api:
                    description: 是否启用API
                    type: boolean
                  enable_api_call:
                    description: API调用开关
                    type: string
                  enable_backflow:
                    description: 是否启用回流
                    type: boolean
                  enable_site:
                    description: 是否启用站点
                    type: boolean
                  engine_status:
                    description: 引擎状态
                    type: string
                  icon:
                    description: 应用图标
                    type: string
                  icon_background:
                    description: 图标背景色
                    type: string
                  id:
                    description: 应用ID
                    type: string
                  mode:
                    description: 模式
                    type: string
                  model_config:
                    description: 模型配置
                    type: object
                  name:
                    description: 应用名称
                    type: string
                  publish_status:
                    description: 发布状态
                    type: string
                  ref_status:
                    description: 引用状态
                    type: boolean
                  status:
                    description: 状态
                    type: string
                  tags:
                    description: 标签列表
                    items:
                      type: string
                    type: array
                  tracing:
                    description: 追踪配置
                    type: object
                  updated_at:
                    description: 更新时间
                    format: date-time
                    type: string
                  workflow_id:
                    description: 工作流ID
                    type: string
                  workflow_updated_at:
                    description: 工作流更新时间
                    format: date-time
                    type: string
                type: object
        "400":
          description: 参数错误
        "401":
          description: 未授权
        "403":
          description: 无权限
      security:
        - Bearer: []
      summary: |-
        创建空白的应用。

        根据传入的参数创建一个新的空白应用，并记录操作日志。

        Args:
            name (str): 应用名称，必填。
            description (str, optional): 应用描述。
            icon (str, optional): 应用图标URL。
            icon_background (str, optional): 图标背景色。
            categories (list, optional): 应用分类列表。

        Returns:
            tuple: 包含新创建的应用实例和状态码201的元组。

        Raises:
            ValueError: 当应用名称重复或创建失败时抛出。
      tags:
        - 应用商店
  /apps/import:
    post:
      description: 从文件导入应用
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                file:
                  description: 应用文件
                  type: string
                  format: binary
              required:
                - file
      responses:
        "200":
          description: 成功
        "400":
          description: 参数错误
        "401":
          description: 未授权
        "403":
          description: 无权限
      security:
        - Bearer: []
      summary: |-
        从文件导入应用。

        Args:
            file (FileStorage, required): 上传的应用配置文件

        Returns:
            dict: 新创建的应用信息

        Raises:
            ValueError: 当文件格式错误或创建失败时抛出
      tags:
        - 应用商店
  /apps/list/page:
    post:
      description: 使用POST方式获取应用的分页列表，支持更复杂的查询参数
      requestBody:
        content:
          application/json:
            schema:
              properties:
                enable_api:
                  description: 是否启用API
                  type: boolean
                is_published:
                  description: 是否已发布
                  type: boolean
                limit:
                  default: 20
                  description: 每页数量
                  maximum: 100
                  minimum: 1
                  type: integer
                page:
                  default: 1
                  description: 页码
                  maximum: 99999
                  minimum: 1
                  type: integer
                qtype:
                  default: mine
                  description: 查询类型：mine/group/builtin/already
                  enum:
                    - mine
                    - group
                    - builtin
                    - already
                  type: string
                search_name:
                  description: 搜索应用名称
                  type: string
                search_tags:
                  description: 搜索标签列表
                  items:
                    type: string
                  type: array
              type: object
        required: true
      responses:
        "200":
          description: 成功
        "401":
          description: 未授权
        "403":
          description: 无权限
      security:
        - Bearer: []
      summary: |-
        获取应用列表（分页版本）。

        使用POST方式获取应用的分页列表，支持更复杂的查询参数。

        Args:
            page (int, optional): 页码，范围1-99999，默认为1。
            limit (int, optional): 每页数量，范围1-100，默认为20。
            search_name (str, optional): 搜索应用名称，支持模糊匹配。
            search_tags (list, optional): 搜索标签列表。
            qtype (str, optional): 查询类型，可选值：mine/group/builtin/already，默认为mine。
            is_published (bool, optional): 是否已发布的过滤条件。
            enable_api (bool, optional): 是否启用API的过滤条件。

        Returns:
            dict: 包含应用列表的分页数据，使用app_pagination_fields格式。

        Raises:
            ValueError: 当参数验证失败时抛出。
      tags:
        - 应用商店
  /apps/to/apptemplate:
    post:
      description: 将应用转换为模板
      requestBody:
        $ref: "#/components/requestBodies/Body"
      responses:
        "200":
          description: 成功
        "400":
          description: 参数错误
        "401":
          description: 未授权
        "403":
          description: 无权限
      security:
        - Bearer: []
      summary: |-
        将应用转换为模板。

        Args:
            id (str, required): 应用ID
            name (str, optional): 模板名称
            description (str, optional): 模板描述
            icon (str, optional): 模板图标
            icon_background (str, optional): 图标背景色
            categories (list, optional): 模板分类

        Returns:
            dict: 转换操作结果

        Raises:
            ValueError: 当应用未发布或名称重复时抛出
      tags:
        - 应用商店
  /apps/workflows/add_log:
    post:
      description: 添加工作流执行日志
      requestBody:
        content:
          application/json:
            schema:
              properties:
                app_id:
                  description: 应用ID
                  format: uuid
                  type: string
                log:
                  description: 日志内容
                  type: string
                node_id:
                  description: 节点ID
                  type: string
              required:
                - app_id
                - node_id
                - log
              type: object
        required: true
      responses:
        "200":
          description: 成功
        "400":
          description: 参数错误
        "401":
          description: 未授权
        "403":
          description: 无权限
      security:
        - Bearer: []
      summary: 添加(删除)资源(节点)时上报的日志
      tags:
        - 应用商店
  /apps/workflows/batch_log:
    post:
      description: 批量添加工作流执行日志
      requestBody:
        content:
          application/json:
            schema:
              properties:
                app_id:
                  description: 应用ID
                  format: uuid
                  type: string
                logs:
                  description: 日志列表
                  items:
                    properties:
                      log:
                        type: string
                      node_id:
                        type: string
                    type: object
                  type: array
              required:
                - app_id
                - logs
              type: object
        required: true
      responses:
        "200":
          description: 成功
        "400":
          description: 参数错误
        "401":
          description: 未授权
        "403":
          description: 无权限
      security:
        - Bearer: []
      summary: 批量调试时上报的结果日志
      tags:
        - 应用商店
  /apps/workflows/code_assistant:
    post:
      description: 使用AI代码助手生成代码
      requestBody:
        content:
          application/json:
            schema:
              properties:
                code:
                  description: 现有代码
                  type: string
                language:
                  description: 编程语言
                  type: string
                prompt:
                  description: 提示词
                  type: string
              required:
                - prompt
              type: object
        required: true
      responses:
        "200":
          description: 成功
        "400":
          description: 参数错误
        "401":
          description: 未授权
        "403":
