  /key_exchange:
    post:
      description: 进行 ECDH 密钥交换，获取会话密钥用于数据加密
      requestBody:
        content:
          application/json:
            schema:
              properties:
                frontend_public_key:
                  description: 前端公钥（Base64编码）
                  type: string
              required:
                - frontend_public_key
              type: object
        required: true
      responses:
        "200":
          description: 成功
        "400":
          description: 参数错误
        "401":
          description: 未授权
      security: []
      summary: |-
        进行 ECDH 密钥交换

        请求格式：
        {
            "frontend_public_key": "Base64编码的前端公钥"
        }

        响应格式：
        {
            "backend_public_key": "Base64编码的后端公钥",
            "session_id": "会话ID（UUID）",
            "expires_in": 300,
            "algorithm": "ECDH-P256 + AES-256-GCM"
        }

        Returns:
            dict: 包含后端公钥和会话 ID 的字典

        Raises:
            ValueError: 当前端公钥格式错误时抛出
      tags:
        - auth
  /login:
    post:
      description: 使用用户名/邮箱/手机号和密码进行登录
      requestBody:
        $ref: "#/components/requestBodies/Body14"
      responses:
        "200":
          description: 成功
        "400":
          description: 参数错误
        "401":
          description: 未授权
      security: []
      summary: |-
        用户密码登录。

        接收 encrypted_data 和 session_id 参数，使用 ECDH 会话密钥解密。
        请求数据应包含：name 或 email 或 phone（至少一个），以及 password

        使用用户名/邮箱和密码进行身份验证并登录系统。
        验证成功后记录登录日志并返回访问令牌。

        Returns:
            dict: 包含登录成功结果和访问令牌的字典

        Raises:
            ValueError: 当身份验证失败时抛出
      tags:
        - auth
  /login_sms:
    post:
      description: 使用手机号和短信验证码进行登录
      requestBody:
        $ref: "#/components/requestBodies/Body14"
      responses:
        "200":
          description: 成功
        "400":
          description: 参数错误
        "401":
          description: 未授权
      security: []
      summary: |-
        短信验证码登录。

        接收 encrypted_data 和 session_id 参数，使用 ECDH 会话密钥解密。
        请求数据应包含：phone, verify_code

        使用手机号和短信验证码进行身份验证并登录系统。
        如果用户账号不存在，会缓存验证码用于后续注册流程。

        Returns:
            dict: 包含登录成功结果和访问令牌的字典

        Raises:
            ValueError: 当验证码验证失败或用户认证失败时抛出
      tags:
