  /forgot-password:
    post:
      description: 向用户注册邮箱发送包含重置链接的邮件
      requestBody:
        content:
          application/json:
            schema:
              properties:
                email:
                  description: 用户邮箱
                  format: email
                  type: string
              required:
                - email
              type: object
        required: true
      responses:
        "200":
          description: 成功
        "400":
          description: 参数错误
        "401":
          description: 未授权
      security: []
      summary: |-
        发送密码重置邮件。

        向用户注册邮箱发送包含重置链接的邮件。在调试模式下，
        响应中会包含重置令牌用于测试目的。

        Request Body:
            email (str): 用户注册邮箱地址

        Returns:
            dict: 包含操作结果的字典
                - result (str): 操作结果状态
                - token (str, optional): 调试模式下的重置令牌

        Raises:
            InvalidEmailError: 邮箱格式无效
            ValueError: 邮箱未注册

        Example:
            POST /forgot-password
            {
                "email": "user@example.com"
            }
      tags:
        - auth
  /forgot-password/admin-resets:
    post:
      description: 管理员强制重置指定用户的密码
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  description: 目标用户名
                  type: string
                new_password:
                  description: 新密码
                  type: string
                password_confirm:
                  description: 确认新密码
                  type: string
              required:
                - name
                - new_password
                - password_confirm
              type: object
        required: true
      responses:
        "200":
          description: 成功
        "400":
          description: 参数错误
        "401":
          description: 未授权
        "403":
          description: 无权限
      security:
        - Bearer: []
      summary: |-
        管理员强制重置用户密码。

        允许具有管理员权限的用户为任意指定用户重置密码，
        无需密码重置令牌。操作会被详细记录在审计日志中。

        Request Body:
            name (str): 目标用户名
            new_password (str): 新密码
            password_confirm (str): 新密码确认

        Returns:
            dict: 包含操作结果的字典
                - result (str): 操作结果状态

        Raises:
            PasswordMismatchError: 密码确认不一致
            ValueError: 权限不足、用户不存在或密码强度不足

        Example:
            POST /forgot-password/admin-resets
            {
                "name": "target_user",
                "new_password": "new_secure_password",
                "password_confirm": "new_secure_password"
            }
      tags:
        - auth
  /forgot-password/resets:
    post:
      description: 使用有效的重置令牌更新用户密码
      requestBody:
        content:
          application/json:
            schema:
              properties:
                new_password:
                  description: 新密码
                  type: string
                password_confirm:
                  description: 确认新密码
                  type: string
                token:
                  description: 密码重置令牌
                  type: string
              required:
                - token
                - new_password
                - password_confirm
              type: object
        required: true
      responses:
        "200":
          description: 成功
        "400":
          description: 参数错误
        "401":
          description: 未授权
        "403":
          description: 无权限
      security: []
      summary: |-
        重置用户密码。

        使用有效的重置令牌更新用户密码。验证新密码的强度和一致性，
        生成新的密码哈希，更新数据库并记录操作日志。

        Request Body:
            token (str): 密码重置令牌（管理员重置时可为特殊值）
            new_password (str): 新密码
            password_confirm (str): 新密码确认

        Returns:
            dict: 包含操作结果的字典
                - result (str): 操作结果状态

        Raises:
            PasswordMismatchError: 密码确认不一致
            InvalidTokenError: 令牌无效或已过期
            ValueError: 密码强度不足或其他验证错误

        Example:
            POST /forgot-password/resets
            {
                "token": "reset_token_string",
                "new_password": "new_secure_password",
                "password_confirm": "new_secure_password"
            }
      tags:
        - auth
  /forgot-password/validity:
    post:
      description: 验证密码重置令牌的有效性
      requestBody:
        content:
          application/json:
            schema:
              properties:
                token:
                  description: 密码重置令牌
                  type: string
              required:
                - token
              type: object
        required: true
      responses:
        "200":
          description: 成功
        "400":
          description: 参数错误
        "401":
          description: 未授权
      security: []
      summary: |-
        验证密码重置令牌的有效性。

        检查用户提供的重置令牌是否有效且未过期。
        返回令牌状态和关联的邮箱地址。

        Request Body:
            token (str): 密码重置令牌

        Returns:
            dict: 包含验证结果的字典
                - is_valid (bool): 令牌是否有效
                - email (str or None): 关联的邮箱地址

        Example:
            POST /forgot-password/validity
            {
                "token": "reset_token_string"
            }
      tags:
        - auth
