                      created_from_info:
                        description: 创建来源
                        type: string
                      description:
                        description: 任务描述
                        type: string
                      finetune_config:
                        description: 微调配置
                        type: object
                      finetuning_type:
                        description: 微调类型
                        type: string
                      id:
                        description: 任务ID
                        type: integer
                      log_path:
                        description: 日志路径
                        type: string
                      name:
                        description: 任务名称
                        type: string
                      status:
