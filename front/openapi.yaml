  /model_evalution/create_task:
    post:
      description: 创建新的评估任务，支持人工测评和AI测评两种方式，需要登录和写入权限
      requestBody:
        content:
          application/json:
            schema:
              properties:
                ai_evaluator_name:
                  description: AI评估器名称（当evaluation_method为ai时必填）
                  type: string
                dataset_id:
                  description: 数据集ID列表
                  items:
                    type: integer
                  type: array
                dimensions:
                  description: 评估维度列表
                  items:
                    properties:
                      ai_base_score:
                        type: integer
                      dimension_description:
                        type: string
                      dimension_name:
                        type: string
                      options:
                        items:
                          properties:
                            option_description:
                              type: string
                            value:
                              type: integer
                          type: object
                        type: array
                    type: object
                  type: array
                evaluation_method:
                  description: 评估方法：manual（人工测评）/ai（AI测评）
                  enum:
                    - manual
                    - ai
                  type: string
                evaluation_type:
                  description: 评估类型：offline（离线）/online（在线）
                  enum:
                    - offline
                    - online
                  type: string
                model_name:
                  description: 测评模型名称
                  type: string
                prompt:
                  description: AI评估prompt（当evaluation_method为ai时可选，需包含{scene}、{scene_descrp}、{standard}、{instruction}、{output}、{response}占位符）
                  type: string
                task_name:
                  description: 任务名称
                  type: string
              required:
                - task_name
                - dataset_id
                - evaluation_method
                - model_name
                - evaluation_type
                - dimensions
              type: object
        required: true
      responses:
        "200":
          description: 创建成功
          content:
            "*/*":
              schema:
                properties:
                  code:
                    example: 200
                    type: integer
                  message:
                    example: 任务创建成功
                    type: string
                type: object
        "400":
          description: 参数错误
        "401":
          description: 未授权
        "403":
          description: 无权限
      security:
        - Bearer: []
      summary: |-
        创建新的评估任务。

        Args:
            通过JSON请求体传递参数：
                name (str): 任务名称。
                description (str, optional): 任务描述。
                dataset_ids (list): 数据集ID列表。
                model_ids (list): 模型ID列表。
                evaluation_dimensions (list): 评估维度列表。

        Returns:
            dict: 创建结果信息，包含任务ID。

        Raises:
            ValueError: 当必要参数缺失时抛出异常。
      tags:
        - 模型评测
